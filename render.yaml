services:
  - type: web
    name: ojt-expiration-tracker
    env: python
    plan: free
    branch: main
    runtime: python-3.12
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    
    customDomains:
      - your.custom.domain
    
    envVars:
      # Flask Configuration
      - key: FLASK_ENV
        value: production
      
      # Database: Set via Render Dashboard or here
      # Leave blank and configure via Render Dashboard Environment tab
      # Example: postgresql://user:pass@ep-xxxxx.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false  # Configure in Render dashboard instead
      
      # Security: Must set via Render Dashboard for production
      - key: SECRET_KEY
        sync: false  # Configure in Render dashboard instead
      
      # Director Account Setup (change these!)
      - key: DIRECTOR_USERNAME
        value: director
      
      - key: DIRECTOR_PASSWORD
        sync: false  # Configure in Render dashboard instead

