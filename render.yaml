services:
  - type: web
    name: ojt-expiration-tracker
    env: python
    plan: free
    branch: Hestia
    runtime: python-3.12

    buildCommand: pip install -r requirements.txt

    # Run migrations first, then ensure admin exists
    preDeployCommand: flask db upgrade && python setup_admin.py

    # Start the Flask app
    startCommand: gunicorn wsgi:app

    autoDeploy: true

    envVars:
      - key: FLASK_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        sync: false

      - key: DIRECTOR_USERNAME
        value: director

      - key: DIRECTOR_PASSWORD
        sync: false