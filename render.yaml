services:
  - type: web
    name: ojt-expiration-tracker
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    customDomains:
      - your.custom.domain
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///moa.db
